document.querySelectorAll(".password-toggle").forEach(btn=>{
 btn.addEventListener("click",()=>{
  const input=$(btn.dataset.target);
  const show=input.type==="password";
  input.type=show?"text":"password";
  btn.textContent=show?"🙈":"👁";
  btn.setAttribute("aria-label",show?"Hide password":"Show password");
  btn.title=show?"Hide password":"Show password";
 });
});
$("googleLogin").onclick=()=>{window.location.href="/auth/google"};

$("signupForm").addEventListener("submit",async e=>{
 e.preventDefault();try{
  const r=await fetch("/auth/signup",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({name:$("signupName").value.trim(),email:$("signupEmail").value.trim(),password:$("signupPassword").value})}),d=await r.json();

document.querySelectorAll(".buy-plan").forEach(btn=>btn.addEventListener("click",()=>buyPlan(btn.dataset.plan)));
async function buyPlan(planId){
 if(!requireLogin())return;
 try{
  const r=await fetch("/payments/create-order",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({plan_id:planId})}),d=await r.json();
  if(!r.ok||!d.success)throw new Error(d.error||"Could not start payment.");
  if(typeof Razorpay==="undefined")throw new Error("Payment checkout could not load.");
  const options={key:d.key_id,amount:d.amount,currency:d.currency,name:"AI Voice Studio Pro",description:"TTS "+planId+" plan",order_id:d.order_id,
   handler:async function(resp){
    const vr=await fetch("/payments/verify",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(resp)}),vd=await vr.json();
    if(!vr.ok||!vd.success){showError(vd.error||"Payment verification failed.");return}
    currentUser=vd.user;renderUser();showSuccess("✓ Payment verified. Your plan is active.");await loadAccount()
   },
   theme:{color:"#7050ff"}
  };
  new Razorpay(options).open()
 }catch(e){showError(e.message)}
}

updateSliders();applyStyle();loadVoiceLibrary();loadMe();
if(new URLSearchParams(location.search).get("login")==="success"){history.replaceState({},document.title,location.pathname);setTimeout(()=>showSuccess("✓ Google login successful."),500)}
